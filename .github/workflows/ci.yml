name: CI

on:
  push:
    branches: [main, 'memory-v2-*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: abtest
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: abtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abtest -d abtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENT_BRAIN_TEST_PG_DSN: postgres://abtest:test-only@127.0.0.1:5432/abtest?sslmode=disable
      AGENT_BRAIN_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: GORACE=atexit_sleep_ms=0 go test -race ./internal/assistant/... ./internal/cli ./internal/memory ./internal/mcpserver ./internal/store

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      # Pinned so lint results are reproducible; bump deliberately.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      # Fails on ANY finding. govulncheck reports only vulnerabilities reachable
      # from the call graph, so every finding is actionable by construction.
      #
      # Pinned like golangci-lint above, and for a sharper reason: x/vuln v1.8.0
      # raised its own go directive to 1.26.0, so @latest scans against a
      # toolchain this workflow does not pin and the release does not ship.
      # v1.7.0 is the last release that builds on Go 1.25. The advisory database
      # is fetched at run time, so the pin delays no finding.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
